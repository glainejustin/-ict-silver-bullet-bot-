# Runs the dashboard and the automated scheduler as two containers sharing
# the same SQLite database via a mounted volume. Use this when you're ready
# to deploy for real on any Docker host (a £3-5/month VPS, etc.).
#
#   docker compose up -d --build
#
services:
  dashboard:
    build: .
    command: python app.py
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  scheduler:
    build: .
    command: python scheduler.py
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
