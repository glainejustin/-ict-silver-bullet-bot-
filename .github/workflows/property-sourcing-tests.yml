name: Property Sourcing Autopilot Tests

# Scoped to the property_sourcing/ project only, so it never runs (or blocks)
# anything related to the trading bot in the rest of this repo.
on:
  push:
    paths:
      - "property_sourcing/**"
      - ".github/workflows/property-sourcing-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "property_sourcing/**"
      - ".github/workflows/property-sourcing-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: property_sourcing

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: property_sourcing/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Verify offline demo pipeline runs end to end
        run: python run_pipeline.py --demo

      - name: Byte-compile all modules (catches syntax errors early)
        run: |
          python -m py_compile app.py config.py db.py pipeline.py rental_pipeline.py run_pipeline.py scheduler.py
          python -m py_compile connectors/*.py agents/*.py outreach/*.py
